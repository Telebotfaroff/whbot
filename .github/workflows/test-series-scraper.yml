name: Test Series Scraper

on:
  workflow_dispatch:
    inputs:
      series_url:
        description: "WatchHentai series URL to scrape"
        required: true
        type: string

jobs:
  scrape-series:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests "Pillow>=10,<13"

      - name: Extract series episodes
        env:
          WATCHHENTAI_BASE_URL: https://watchhentai.net
          SERIES_URL: ${{ inputs.series_url }}
          SERIES_RESULT_FILE: series-result.txt
        run: python tests/test_series_scraper.py

      - name: Upload scraper result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: series-scraper-result
          path: series-result.txt
          if-no-files-found: warn
