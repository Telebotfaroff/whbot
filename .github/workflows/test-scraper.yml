name: Scraper Regression Tests

on:
  push:
    branches: [gofile]
    paths:
      - "providers/**"
      - "crawler/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test-scraper.yml"
  pull_request:
    paths:
      - "providers/**"
      - "tests/**"
      - ".github/workflows/test-scraper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests "Pillow>=10,<13" beautifulsoup4 python-dotenv

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
