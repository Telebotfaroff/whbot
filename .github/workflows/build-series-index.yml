name: Build Series Index

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Number of series listing pages to crawl"
        required: true
        default: "42"
        type: string

permissions:
  contents: write

jobs:
  build-series-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests "Pillow>=10,<13" beautifulsoup4

      - name: Build series JSON index
        env:
          WATCHHENTAI_BASE_URL: https://watchhentai.net
          SERIES_INDEX_PAGES: ${{ inputs.pages }}
        run: python tests/build_series_index.py

      - name: Commit series index to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whdata/
          if git diff --cached --quiet; then
            echo "No series index changes."
            exit 0
          fi
          git commit -m "Update series index data"
          git push
